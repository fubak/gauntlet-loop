</head>

    return cmd;

  /** @typedef {"keyboard" | "mouse" | "gamepad" | "touch" | "voice" | "typed"} CommandSource */
  /** @typedef {{ type: string, payload?: object, source: CommandSource }} CommandLike */

  /** @type {SessionMode} */
  var MODE_BOOT = "boot";

/**
 * Pure parseIntent(text) from the plan phrase table. No DOM, no speech.
 */
(function parseIntentModule(factory) {
  "use strict";

  /** @typedef {"red" | "blue" | "green"} EnemyColor */
  /** @typedef {{ color?: EnemyColor, side?: "left" | "right" | "center" }} CommandPayload */
  /** @typedef {{ type: string, payload?: CommandPayload, source: string }} Command */

  /** @type {EnemyColor[]} */
  var COLORS = ["red", "blue", "green"];

  /** @type {Record<string, boolean>} */
  var STOPWORDS = {
    a: true,
    an: true,
    and: true,
    at: true,
    go: true,
    ahead: true,
    my: true,
    now: true,
    one: true,
    please: true,
    the: true,
    to: true,
  };

   * @param {string} type
   * @param {CommandPayload} [payload]
   * @returns {Command}

    return {
      type: type,
      payload: payload ? Object.assign({}, payload) : {},
      source: "typed",
    };
  }

  /**
   * @param {string} raw
   * @returns {string}
   */
  function normalize(raw) {
    return String(raw).toLowerCase().replace(/\s+/g, " ").trim();
  }

  /**
   * @param {string} text
   * @returns {EnemyColor | null}
   */
  function findColor(text) {
    for (var i = 0; i < COLORS.length; i++) {
      var color = COLORS[i];
      var re = new RegExp("\\b" + color + "\\b");
      if (re.test(text)) {
        return color;
      }

    return null;
  }

   * @param {string} text
   * @returns {"left" | "right" | null}
   */

    if (/\bleft\b/.test(text)) {
      return "left";
    }
    if (/\bright\b/.test(text)) {
      return "right";
    }
    return null;

   * @param {string} text
   * @returns {boolean}
   */

    return /\b(fire|shoot)\b/.test(text);
  }

   * @param {string} norm
   * @returns {boolean}
   */
  function isBareFirePhrase(norm) {
    if (norm === "fire" || norm === "shoot") {
      return true;
    }
    var tokens = norm.split(/\s+/);
    var i;
    for (i = 0; i < tokens.length; i++) {
      var tok = tokens[i];
      if (tok === "fire" || tok === "shoot") {
        continue;
      }
      if (STOPWORDS[tok]) {
        continue;
      }
      return false;

    return hasFireVerb(norm);

   * @param {string} norm
   * @returns {boolean}

      /\b(fire|shoot)\s+left\b/.test(norm) ||
      /\b(fire|shoot)\s+right\b/.test(norm) ||
      /\bleft\s+(fire|shoot)\b/.test(norm) ||

    if (/\buse\s+special\b/.test(norm)) {
      return [makeCommand("special")];

        makeCommand("fire", { color: color }),

})(undefined);
/**
 * Highway world state and step logic. No drawing or text parsing.
 */
(function simModule() {
  "use strict";

  var WORLD_WIDTH = 100;
  var PLAYER_Y = 82;
  var PLAYER_X_MIN = 10;
  var PLAYER_X_MAX = 90;
  var LATERAL_SPEED = 42;
  var SCROLL_SPEED = 55;

  /**
   * @typedef {{
   *   playerX: number,
   *   playerY: number,
   *   roadScroll: number,
   *   worldWidth: number,
   *   worldHeight: number
   * }} SimState
   */

  /**
   * @returns {SimState}
   */
  function createSim() {
    return {
      playerX: WORLD_WIDTH * 0.5,
      playerY: PLAYER_Y,
      roadScroll: 0,
      worldWidth: WORLD_WIDTH,
      worldHeight: 100,

   * @param {SimState} sim
   * @param {number} dt seconds

    if (sim.playerX < PLAYER_X_MIN) {
      sim.playerX = PLAYER_X_MIN;

      sim.playerX = PLAYER_X_MAX;

    module.exports = api;
  }

    globalThis.GauntletLoopSim = api;
  }

 * Combat: lock, fire thirds, special, loot, collect-all. No parsing or drawing.

  /** @typedef {"red" | "blue" | "green"} EnemyColor */

      specialCooldown: 0,
      magnetUntil: 0,
      spawnTimer: 0,
      nextEnemyId: 1,

      specialFlashUntil: 0,
