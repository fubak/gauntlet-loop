name = "gauntlet-loop"
main = "worker/index.js"
compatibility_date = "2024-11-01"

[assets]
directory = "./dist"
binding = "ASSETS"

[[durable_objects.bindings]]
name = "SESSION"
class_name = "SessionObject"

[[durable_objects.bindings]]
name = "ROOM"
class_name = "RoomObject"

[[migrations]]
tag = "v1"
new_classes = ["SessionObject"]

[[migrations]]
tag = "v2"
new_classes = ["RoomObject"]

[[kv_namespaces]]
binding = "WRITER_INDEX"
id = "00000000000000000000000000000000"
preview_id = "00000000000000000000000000000000"
