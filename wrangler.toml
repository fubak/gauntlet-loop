name = "gauntlet-loop"
main = "worker/index.js"
compatibility_date = "2024-11-01"
account_id = "4654797f062b81d036f9f5142ead6bcf"

[assets]
directory = "./dist"
binding = "ASSETS"

[[durable_objects.bindings]]
name = "SESSION"
class_name = "SessionObject"

[[durable_objects.bindings]]
name = "ROOM"
class_name = "RoomObject"

[[migrations]]
tag = "v1"
new_classes = ["SessionObject"]

[[migrations]]
tag = "v2"
new_classes = ["RoomObject"]

[[kv_namespaces]]
binding = "WRITER_INDEX"

[previews]

[[previews.durable_objects.bindings]]
name = "SESSION"
class_name = "SessionObject"

[[previews.durable_objects.bindings]]
name = "ROOM"
class_name = "RoomObject"

[[previews.kv_namespaces]]
binding = "WRITER_INDEX"
id = "4509d6eed79a4231a4b4f6815ab019cd"
